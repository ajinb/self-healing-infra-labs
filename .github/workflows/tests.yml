name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - ch04-mcp-production
          - ch05-alert-explainer
          - ch06-incident-scribe
          - ch07-sre-agent
          - ch08-closed-loop-remediation
          - ch09-bounded-autonomy
    name: ${{ matrix.lab }}
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
      - name: Test
        run: pytest -q
