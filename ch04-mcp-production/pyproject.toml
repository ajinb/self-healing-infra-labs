[project]
name = "ch04-mcp-production"
version = "0.1.0"
description = "Chapter 4 MCP-in-production lab — Self-Healing Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# src layout without requiring an editable install (in-repo venvs under an
# iCloud-synced path break `pip install -e .`)
pythonpath = ["src"]
