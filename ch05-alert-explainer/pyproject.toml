[project]
name = "ch05-alert-explainer"
version = "0.1.0"
description = "Chapter 5 alert-enrichment lab — Self-Healing Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.40",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_explainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# src layout without an editable install (in-repo venvs under an iCloud-synced
# path break `pip install -e .`)
pythonpath = ["src"]
