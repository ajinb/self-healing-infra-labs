# OPA + Redis + the approval-queue service. The Ch 9 lab depends on the
# Ch 8 remediator package being on the PYTHONPATH; in production the two
# would be deployed independently.
version: "3.9"

services:
  opa:
    image: openpolicyagent/opa:0.66.0
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "/policies/autonomy.rego"
      - "/policies/budget.rego"
    ports:
      - "8181:8181"
    volumes:
      - ../policies:/policies:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  approval-queue:
    build:
      context: ..
      dockerfile: fixtures/Dockerfile.approval
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8090:8090"
    depends_on: [redis]
