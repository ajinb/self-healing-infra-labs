apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: registry.local/api:bad
          # The "bad" image returns 500 on /healthz, simulating a deploy
          # regression. Rollback to the previous ReplicaSet should restore
          # the baseline error rate within the verifier's window.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
