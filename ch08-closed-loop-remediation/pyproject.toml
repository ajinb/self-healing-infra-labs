[project]
name = "remediator"
version = "0.1.0"
description = "Closed-loop remediator — Chapter 8 of Self-Healing Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=29.0.0",
    "pydantic>=2.6",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remediator"]
